name: en16931_ubl
description: >-
  Writes and reads the European electronic invoice as UBL 2.1, the syntax
  Peppol and most of Europe carry. Works on the EN 16931 semantic model.
version: 0.1.9
homepage: https://packages.comapps.be/#en16931_ubl
repository: https://github.com/raphrmx/en16931_ubl
issue_tracker: https://github.com/raphrmx/en16931_ubl/issues
funding:
  - https://www.paypal.com/donate/?hosted_button_id=ZN6D382YQAV5N
topics:
  - einvoicing
  - en16931
  - ubl
  - peppol
  - invoice
screenshots:
  - description: Which packages to add for a Peppol, UBL.BE, XRechnung or Factur-X invoice, and what each one writes.
    path: screenshots/situations.png

environment:
  sdk: ^3.3.0

dependencies:
  decimal: ^3.2.6
  en16931: ^0.1.6
  xml: ^7.1.0

dev_dependencies:
  lint: ^2.4.0
  test: ^1.32.0
