  - ubl
  - peppol
  - invoice

environment:
  sdk: ^3.3.0

dependencies:
  decimal: ^3.0.0
  en16931: ^0.1.0
  xml: ^6.5.0

dev_dependencies:
  lint: ^2.10.0
  test: ^1.31.0
