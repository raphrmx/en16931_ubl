  - ubl
  - peppol
  - invoice

environment:
  sdk: ^3.11.0

dependencies:
  decimal: ^3.2.6
  en16931: ^0.1.0
  xml: ^7.0.0

dev_dependencies:
  lint: ^2.12.0
  test: ^1.32.0
